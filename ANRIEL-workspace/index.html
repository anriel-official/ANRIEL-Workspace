<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ゲーム許諾管理</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="tools/game-permissions/game-pages.css">
</head>
<body>
    <header>
        <strong>ゲーム許諾管理</strong>
    </header>
    <main>
        <h1>ゲーム許諾管理</h1>
        <p>利用する機能を選択してください。</p>
        <aside>ローカル試作版です。ログイン・共有権限は未実装です。機密情報は登録しないでください。</aside>
        <div class="permission-grid">
            <a class="permission-card" href="tools/game-permissions/approved.html">
                <h2>許諾済みゲーム一覧</h2>
                <p>登録されたゲームの許諾状況と配信条件を確認します。</p>
            </a>
            <a class="permission-card" href="tools/game-permissions/application.html">
                <h2>許諾申請所</h2>
                <p>ゲーム情報を手入力し、申請状況を管理します。</p>
            </a>
            <a class="permission-card" href="tools/game-permissions/registry.html">
                <h2>管理編集</h2><p>メーカー・カテゴリの管理とDiscord文章からの登録。</p>
            </a>
            <a class="permission-card" href="tools/game-permissions/mypage.html">
                <h2>マイページ</h2><p>自分の申請履歴とお気に入りを確認。</p>
            </a>
        </div>
    </main>
</body>
</html>
