<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ディスコード文章での申請</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="game-pages.css">
    
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" defer></script><script src="supabase-config.js" defer></script><script src="workspace-discord-auth.js" defer></script><script src="../../js/workspace-account.js" defer></script></head>
<body data-page="discord">
    <header class="workspace-unified-header"><a class="workspace-header-brand" href="index.html">ゲーム許諾管理</a><nav class="workspace-header-nav" aria-label="ページ移動"><a href="../../index.html">ツール一覧に戻る</a><a href="index.html">ゲーム一覧に戻る</a></nav></header>
    <main>
        <h1>ディスコード文章での申請</h1>
        <p>Discordの文章を貼り付け、抽出結果を確認して記録します。</p>
        <form id="game-form" class="permission-form">
            <label for="raw">Discordの文章</label>
            <textarea id="raw" rows="8" placeholder="ゲーム名：〇〇&#10;メーカー：〇〇&#10;収益化：可能&#10;条件：〇〇"></textarea>
            <button type="button" id="extract">文章から項目を抽出</button>
            <input type="hidden" id="edit-id">
            <label for="title">ゲームタイトル <span class="required">必須</span></label>
            <input id="title" required maxlength="200">
            <label for="maker">メーカー・権利元</label>
            <input id="maker" list="maker-options" maxlength="200" autocomplete="off">
            <datalist id="maker-options"></datalist>
            <label for="store-url">ゲームストアURL</label>
            <input id="store-url" type="url" placeholder="https://...">
            <label for="official-url">ゲーム公式サイト</label>
            <input id="official-url" type="url" placeholder="https://...">
            <label for="category">カテゴリ（入力済み候補から選択・新規入力可）</label>
            <input id="category" list="category-options" maxlength="100" autocomplete="off">
            <datalist id="category-options"></datalist>
            <label for="required-text">必須記載事項</label>
            <textarea id="required-text" rows="4"></textarea>
            <label for="recommended-text">推奨記載事項</label>
            <textarea id="recommended-text" rows="4"></textarea>
            <label for="superchat">スパチャ</label>
            <select id="superchat"><option>未確認</option><option>OK</option><option>NG</option></select>
            <label for="supersticker">スパステ</label>
            <select id="supersticker"><option>未確認</option><option>OK</option><option>NG</option></select>

            <label for="status">許諾状況（手動で確認）</label>
            <select id="status">
                <option>未確認</option><option>確認中</option><option>申請中</option>
                <option>条件付き</option><option>許諾済み</option><option>不可</option>
            </select>
            <label for="monetize">収益化</label>
            <select id="monetize">
                <option>未確認</option><option>可能</option><option>条件付き</option><option>不可</option>
            </select>
            <label for="source">許諾の根拠</label>
            <select id="source">
                <option>未確認</option><option>Discord投稿</option><option>公式ガイドライン</option><option>個別許諾</option>
            </select>
            <label for="source-url">参照URL（任意）</label>
            <input id="source-url" type="url" placeholder="https://...">
            <label for="notes">配信条件・備考</label>
            <textarea id="notes" rows="4"></textarea>
            <div class="permission-actions">
                <button type="submit">確認して記録を保存</button>
                <button type="button" id="reset-form" class="secondary">入力をクリア</button>
            </div>
        </form>
    </main>
</body>
</html>
