<!DOCTYPE html><html lang="ja"><head><title>メンバー管理 | ゲーム許諾管理</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../css/style.css"><link rel="stylesheet" href="game-pages.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" defer></script><script src="supabase-config.js" defer></script><script src="workspace-discord-auth.js" defer></script><script src="workspace-members.js" defer></script><script src="../../js/workspace-account.js" defer></script></head><body data-page="members"><header class="workspace-unified-header"><a class="workspace-header-brand" href="index.html">ゲーム許諾管理</a><nav class="workspace-header-nav" aria-label="ページ移動"><a href="../../index.html">ツール一覧に戻る</a><a href="index.html">ゲーム一覧に戻る</a></nav></header><main><div class="workspace-page-heading"><h1>メンバー管理</h1><p>DiscordユーザーID・名前・役職を登録します。登録されたアカウントだけが利用できます。</p></div><section class="workspace-panel"><h2>メンバーを追加</h2><form id="member-create" class="workspace-member-form"><label>DiscordユーザーID<input name="discordId" required pattern="[0-9]{15,25}" inputmode="numeric" autocomplete="off" placeholder="例：123456789012345678"></label><label>名前（識別用）<input name="displayName" required maxlength="100" placeholder="例：白瀬はまや"></label><label>役職<select name="role"><option value="talent">タレント</option><option value="staff">スタッフ</option><option value="admin">管理者</option><option value="engineer">エンジニア</option></select></label><div class="workspace-form-actions"><button class="workspace-primary-button" type="submit">メンバーを追加</button></div></form><p id="member-result" class="workspace-status" role="status" aria-live="polite"></p></section><section class="workspace-panel workspace-members-section"><div class="workspace-section-heading"><h2>登録メンバー</h2><p>名前を先頭に表示します。編集で名前・役職を変更できます。</p></div><div id="member-list" class="workspace-member-list"><p>メンバーを読み込んでいます…</p></div></section></main></body></html>
