<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイページ | ゲーム許諾管理</title>
  <link rel="stylesheet" href="../../css/style.css?v=20261117-header2">
  <link rel="stylesheet" href="game-pages.css?v=20261117-header2">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" defer></script>
  <script src="supabase-config.js" defer></script>
  <script src="workspace-discord-auth.js" defer></script>
  <script src="workspace-personal.js" defer></script>
  <script src="workspace-applications.js" defer></script>
  <script src="workspace-mypage-tabs.js" defer></script>
<script src="../../js/workspace-account.js?v=20261117-header2" defer></script></head>
<body data-page="mypage">
  <header class="workspace-unified-header"><a class="workspace-header-brand" href="../../index.html">ANRIEL Workspace</a><a class="workspace-header-tool" href="index.html">ゲーム管理ページ</a></header>
  <main>
    <div class="workspace-page-heading">
      <h1>マイページ</h1>
      <p>Discord連携アカウント、お気に入り、申請中のゲーム、メモを管理できます。</p>
    </div>
    <section class="workspace-panel workspace-profile-panel" aria-label="Discord連携アカウント">
      <h2>Discord連携アカウント</h2>
      <div class="workspace-profile-line">
        <img id="workspace-profile-avatar" alt="" width="56" height="56">
        <div><strong id="workspace-profile-name">読み込み中…</strong><p id="workspace-profile-discord-id">Discordアカウントを確認しています…</p></div>
      </div>
    </section>
    <div class="workspace-my-tabs" role="tablist" aria-label="マイページの表示切替">
      <button type="button" id="tab-favorites" role="tab" aria-controls="panel-favorites" aria-selected="true">お気に入りゲーム</button>
      <button type="button" id="tab-applications" role="tab" aria-controls="panel-applications" aria-selected="false" tabindex="-1">申請中のゲーム</button>
      <button type="button" id="tab-notes" role="tab" aria-controls="panel-notes" aria-selected="false" tabindex="-1">メモ</button>
    </div>
    <section id="panel-favorites" role="tabpanel" aria-labelledby="tab-favorites" class="workspace-panel workspace-mypage-section">
      <h2>お気に入りゲーム</h2>
      <div id="personal-list" class="workspace-personal-list"></div>
      <p id="personal-status" class="workspace-status" role="status" aria-live="polite"></p>
    </section>
    <section id="panel-applications" role="tabpanel" aria-labelledby="tab-applications" class="workspace-panel workspace-mypage-section" hidden>
      <h2>申請中のゲーム</h2>
      <div id="profile-applications" class="permission-list" aria-live="polite"></div>
    </section>
    <section id="panel-notes" role="tabpanel" aria-labelledby="tab-notes" class="workspace-panel workspace-mypage-section" hidden>
      <h2>メモ <span id="memo-count" class="workspace-memo-count">0 / 10</span></h2>
      <p class="workspace-description">個人用メモを10件まで保存できます。</p>
      <form id="memo-form" class="permission-form workspace-personal-form">
        <input type="hidden" id="memo-id">
        <label for="memo-title">タイトル</label>
        <input id="memo-title" maxlength="120" required placeholder="メモのタイトル">
        <label for="memo-body">内容</label>
        <textarea id="memo-body" maxlength="4000" rows="5" required placeholder="メモの内容"></textarea>
        <div class="permission-actions"><button type="submit" id="memo-save">保存</button><button type="button" id="memo-cancel" hidden>編集をキャンセル</button></div>
      </form>
      <p id="memo-status" class="workspace-status" role="status" aria-live="polite"></p>
      <div id="memo-list" class="workspace-memo-list"></div>
    </section>
  </main>
</body>
</html>
