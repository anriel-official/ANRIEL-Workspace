<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイページ | ゲーム許諾管理</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="game-pages.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" defer></script>
  <script src="supabase-config.js" defer></script>
  <script src="workspace-discord-auth.js" defer></script>
  <script src="workspace-personal.js" defer></script>
  <script src="workspace-applications.js" defer></script>
</head>
<body data-page="mypage">
  <header><a class="workspace-brand" href="index.html">ゲーム許諾管理</a><a class="workspace-header-link" href="index.html">ゲーム許諾管理へ戻る</a><a class="workspace-header-link" href="../../index.html">ツール一覧へ戻る</a></header>
  <main>
    <div class="workspace-page-heading">
      <h1>マイページ</h1>
      <p>自分の申請履歴と、お気に入り・個人メモを管理できます。</p>
    </div>
    <section class="workspace-panel workspace-mypage-section">
      <div class="workspace-section-heading"><h2>自分の申請履歴</h2></div>
      <div id="profile-applications" class="permission-list" aria-live="polite"></div>
    </section>
    <section id="personal-game-data" class="workspace-panel workspace-mypage-section">
      <div class="workspace-section-heading"><h2>お気に入り・個人メモ</h2></div>
      <p class="workspace-description">登録した内容は自分のアカウントにのみ保存されます。</p>
      <form id="personal-data-form" class="permission-form workspace-personal-form">
        <label for="personal-game-key">ゲーム名・識別名</label>
        <input id="personal-game-key" maxlength="250" required>
        <label class="workspace-checkbox-label"><input type="checkbox" id="personal-favorite">お気に入りに登録</label>
        <label for="personal-note">個人メモ</label>
        <textarea id="personal-note" maxlength="4000" rows="4"></textarea>
        <div class="permission-actions"><button type="submit">保存する</button></div>
      </form>
      <p id="personal-status" class="workspace-status" role="status" aria-live="polite"></p>
      <div id="personal-list" class="workspace-personal-list"></div>
    </section>
  </main>
</body>
</html>
